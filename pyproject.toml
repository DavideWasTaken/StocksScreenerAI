[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-dislocation"
version = "0.1.0"
description = "AI-powered narrative dislocation stock screener"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Narrative Dislocation contributors"}]
dependencies = [
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "yfinance>=0.2.54",
  "openai>=1.68.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "requests>=2.32.0",
  "lxml>=5.3.0",
  "beautifulsoup4>=4.12.0",
  "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
narrative-dislocation = "narrative_dislocation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

