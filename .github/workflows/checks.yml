name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          narrative-dislocation --help
          python -m narrative_dislocation screen --help
      - name: Synthetic example regenerates offline
        run: |
          python examples/generate_synthetic_report.py
          # Only the generation timestamp may change.
          git diff --exit-code -I 'generated|Generated|timestamp|_at' -- examples/synthetic_report
