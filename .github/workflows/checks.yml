name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          narrative-dislocation --help
          python -m narrative_dislocation screen --help
      - name: Synthetic example regenerates offline
        # The committed example comes from Python 3.12+, whose sum() is compensated;
        # on 3.11 some unrounded floats differ in the last digit (84.0 vs 84.00000000000001).
        if: matrix.python-version != '3.11'
        run: |
          python examples/generate_synthetic_report.py
          # Only the generation timestamp may change.
          git diff --exit-code -I 'generated|Generated|timestamp|_at' -- examples/synthetic_report
